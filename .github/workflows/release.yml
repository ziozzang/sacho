name: Build, test and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sacho-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  editor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build:lua-editor
        working-directory: web
      - run: git diff --exit-code -- web/lua-editor.js

  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: always
      SACHO_BINARY: target/${{ matrix.target }}/release/sacho
      SACHO_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install musl compiler
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.96.0
          rustup target add '${{ matrix.target }}'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --target '${{ matrix.target }}' -- -D warnings
      - run: cargo test --locked --all-targets --target '${{ matrix.target }}'
      - run: cargo build --locked --release --target '${{ matrix.target }}'
      - run: python3 tests/smoke.py
      - name: Browser and supervised signed HTTPS update qualification
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          python3 -m pip install -r tests/requirements.txt
          python3 -m playwright install --with-deps chromium
          python3 tests/browser.py
          python3 tests/restart.py
      - name: Prepare unsigned qualification assets
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          python3 tools/prepare_release.py --binary "$SACHO_BINARY" --target "$SACHO_TARGET" --version "$VERSION" --output dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sacho-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native, editor]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: qualified
      - name: Sign precise release manifests
        env:
          SACHO_RELEASE_SIGNING_KEY: ${{ secrets.SACHO_RELEASE_SIGNING_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          test "$RELEASE_TAG" = "v$VERSION"
          SIGNER=qualified/sacho-x86_64-unknown-linux-gnu/sacho-x86_64-unknown-linux-gnu
          chmod +x "$SIGNER"
          for dir in qualified/sacho-*; do
            TARGET=${dir#qualified/sacho-}
            python3 tools/prepare_release.py --binary "$dir/sacho-$TARGET" --target "$TARGET" --version "$VERSION" --signer "$SIGNER" --output dist
          done
          cat dist/*.sha256 > dist/SHA256SUMS
          rm dist/*.sha256
      - name: Publish signed release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "Sacho $RELEASE_TAG"
