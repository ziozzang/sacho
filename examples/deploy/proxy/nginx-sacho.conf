# nginx in front of Sacho and a forward-auth service.
# The verifier here follows oauth2-proxy: GET /oauth2/auth answers 2xx with
# X-Auth-Request-Email for a valid session and 401 otherwise. Start oauth2-proxy
# with --set-xauthrequest. Any service with that contract can replace it.
# Replace status.example.com, the certificate paths and the two upstream addresses.

upstream sacho_upstream {
    server 127.0.0.1:8080;
    keepalive 16;
}
upstream sacho_verifier {
    server 127.0.0.1:4180;
}

server {
    listen 80;
    server_name status.example.com;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name status.example.com;
    ssl_certificate     /etc/nginx/tls/status.example.com.crt;
    ssl_certificate_key /etc/nginx/tls/status.example.com.key;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # The whole identity boundary is these lines. Every route sends the variable,
    # which stays empty unless a verified location below fills it, so a value
    # supplied by the client is always replaced. An empty value sends no header.
    set $sacho_identity "";
    proxy_set_header X-Forwarded-Email $sacho_identity;
    # Sacho uses no cookies: keep your sign-in cookie away from the upstream.
    proxy_set_header Cookie "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_http_version 1.1;

    # Internal verification call. It needs the browser's cookie, and nothing else.
    location = /oauth2/auth {
        internal;
        proxy_pass http://sacho_verifier;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Uri $request_uri;
    }

    # Sign-in, callback and sign-out pages of the authentication service.
    location /oauth2/ {
        proxy_pass http://sacho_verifier;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Uri $request_uri;
    }

    # Admin page: send anonymous browsers to sign in.
    location /admin {
        auth_request /oauth2/auth;
        auth_request_set $sacho_identity $upstream_http_x_auth_request_email;
        error_page 401 = @sign_in;
        proxy_pass http://sacho_upstream;
    }
    location @sign_in {
        return 302 /oauth2/sign_in?rd=$scheme://$host$request_uri;
    }

    # Admin and account APIs: answer 401, never a redirect.
    location /api/admin/ {
        auth_request /oauth2/auth;
        auth_request_set $sacho_identity $upstream_http_x_auth_request_email;
        proxy_pass http://sacho_upstream;
    }
    location = /api/account {
        auth_request /oauth2/auth;
        auth_request_set $sacho_identity $upstream_http_x_auth_request_email;
        proxy_pass http://sacho_upstream;
    }

    # Status data: anonymous visitors are welcome, and signed-in visitors should
    # also see monitors limited to them. A failed or unavailable verifier falls
    # back to the anonymous view. If all your monitors are public, delete this
    # location and the next one; the catch-all below then serves these paths.
    location ~ ^/api/(status$|incidents$|history/) {
        auth_request /oauth2/auth;
        auth_request_set $sacho_identity $upstream_http_x_auth_request_email;
        error_page 401 500 502 503 504 = @anonymous;
        proxy_pass http://sacho_upstream;
    }
    location @anonymous {
        set $sacho_identity "";
        proxy_pass http://sacho_upstream;
    }

    # Everything else is public: the page, assets, /healthz, subscriptions, push
    # reports (/api/push/) and workers (/api/workers/). Those last two carry their
    # own bearer credentials and must not be redirected to a sign-in page.
    location / {
        proxy_pass http://sacho_upstream;
    }
}
